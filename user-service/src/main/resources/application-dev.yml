server:
  servlet:
    context-path: /users
  port: 8091
spring:
  docker:
    compose:
      enabled: true
      file: ../compose.yaml
      lifecycle-management: start-only
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: true
  web:
    error:
      whitelabel:
        enabled: false
logging:
  level:
    org:
      springframework: INFO
    com:
      tu2l:
        user: DEBUG
  file:
    name: ../etc/logs/user-service/app.log
  logback:
    rollingpolicy:
      file-name-pattern: ../etc/logs/user-service/%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 7
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
    path: /v3/api-docs

app:
  mail:
    from-address: no-reply@resume-builder.local
    frontend-base-url: http://localhost:3000
    verification-path: /verify-email?token=
    password-reset-path: /reset-password?token=
    verification-subject: "Verify your email"
    password-reset-subject: "Reset your password"
  rate-limit:
    enabled: true
    capacity: 5
    window-seconds: 60
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8080
  auth:
    max-failed-login-attempts: 5
    account-lock-duration-minutes: 15
    remember-me-token-validity-minutes: 14
    jwt:
      secret-key: ${JWT_SECRET_KEY:dev-secret-key-must-be-at-least-256-bits-or-32-characters-long}
      access-token-expiration-minutes: 15
      refresh-token-expiration-days: 7
      issuer: resume-builder-app
