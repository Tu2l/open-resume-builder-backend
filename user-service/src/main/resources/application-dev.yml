server:
  servlet:
    context-path: /users
  port: 8091
spring:
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: true
  web:
    error:
      whitelabel:
        enabled: false
logging:
  level:
    org:
      springframework: INFO
    com:
      tu2l:
        user: DEBUG
  file:
    name: ./etc/logs/user-service/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 1
jwt:
  secret-key: ${JWT_SECRET_KEY:dev-secret-key-must-be-at-least-256-bits-or-32-characters-long}
  access-token:
    expiration-minutes: 15
  refresh-token:
    expiration-days: 7
  issuer: resume-builder-app
auth:
  max-login-attempts: 5
  lockout-duration-minutes: 15
app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8080
