server:
  servlet:
    context-path: /users
  port: 8091
spring:
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  web:
    error:
      whitelabel:
        enabled: false
logging:
  level:
    org:
      springframework: INFO
    com:
      tu2l:
        user: INFO
  file:
    name: /var/log/resume-builder/user-service/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 1
app:
  mail:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@resume-builder.app}
    frontend-base-url: ${FRONTEND_BASE_URL}
    verification-path: /verify-email?token=
    password-reset-path: /reset-password?token=
    verification-subject: "Verify your email"
    password-reset-subject: "Reset your password"
  rate-limit:
    enabled: true
    capacity: 10
    window-seconds: 60
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8080
  auth:
    max-failed-login-attempts: 5
    account-lock-duration-minutes: 15
    remember-me-token-validity-minutes: 14
    jwt:
      secret-key: ${JWT_SECRET_KEY:dev-secret-key-must-be-at-least-256-bits-or-32-characters-long}
      access-token-expiration-minutes: 15
      refresh-token-expiration-days: 7
      issuer: resume-builder-app
