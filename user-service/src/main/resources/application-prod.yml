server:
  servlet:
    context-path: /users
  port: 8091
spring:
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  web:
    error:
      whitelabel:
        enabled: false
logging:
  level:
    org:
      springframework: INFO
    com:
      tu2l:
        user: INFO
  file:
    name: /var/log/resume-builder/user-service/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 1
app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8080
  auth:
    max-failed-login-attempts: 5
    account-lock-duration-minutes: 15
    remember-me-token-validity-minutes: 14
    jwt:
      secret-key: ${JWT_SECRET_KEY:dev-secret-key-must-be-at-least-256-bits-or-32-characters-long}
      access-token-expiration-minutes: 15
      refresh-token-expiration-days: 7
      issuer: resume-builder-app
