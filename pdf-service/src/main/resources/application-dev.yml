server:
  servlet:
    context-path: /pdf
  port: 8090
  error:
    whitelabel:
      enabled: false
spring:
  docker:
    compose:
      enabled: true
      file: ../compose.yaml
      lifecycle-management: start-only
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        ddl-auto: create
      show-sql: true
logging:
  level:
    org:
      springframework: INFO
    com:
      tu2l:
        pdf: DEBUG
  file:
    name: ./etc/logs/pdf-service/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 1
