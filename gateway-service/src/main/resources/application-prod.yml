server:
  port: 8080
  error:
    whitelabel:
      enabled: false

gateway: # Custom gateway configuration
  public-routes:
    - /api/users/v1/auth/**
    - /api/pdf/**
  service-urls:
    user-service: http://user-service:8091
    pdf-service: http://pdf-service:8090

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Common configuration
logging:
  level:
    org:
      springframework:
        cloud:
          gateway: INFO
        web: INFO
    com:
      tu2l:
        gateway: INFO
        pdf: INFO
    reactor:
      netty: INFO
  file:
    name: ../etc/logs/gateway-service/app.log
  logback:
    rollingpolicy:
      file-name-pattern: ../etc/logs/gateway-service/%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token:
    expiration-minutes: 15
  refresh-token:
    expiration-days: 7
  issuer: resume-builder-app
